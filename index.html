<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04040F">
<title>Munch</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #04040F;
    overscroll-behavior: none;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #wrap{ position:fixed; inset:0; display:flex; flex-direction:column; }
  #game { display:block; width:100%; flex:1; min-height:0; }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items:center;
    padding: calc(10px + env(safe-area-inset-top)) 18px 8px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    color: #dfe6ff;
    letter-spacing: 0.06em;
    z-index: 5;
  }
  .hud .label { font-size: 9px; opacity: 0.5; text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 2px; }
  .hud .value { font-size: 19px; font-weight: 600; color: #FFD65C; text-shadow: 0 0 10px rgba(255,214,92,0.5); }
  .hud .best .value { color: #5CA8FF; text-shadow: 0 0 10px rgba(92,168,255,0.5); }
  .hud .best { text-align: right; }
  .hud .lives-row{ display:flex; gap:6px; align-items:center; }
  .hud .lives-row .pac{ width:12px; height:12px; border-radius:50%; background:#FFD65C; clip-path: polygon(100% 50%, 45% 0%, 0% 20%, 0% 80%, 45% 100%); }

  .dpad{
    position:fixed;
    left: calc(16px + env(safe-area-inset-left));
    bottom: calc(16px + env(safe-area-inset-bottom));
    width:140px; height:140px;
    display:grid;
    grid-template-columns:44px 44px 44px;
    grid-template-rows:44px 44px 44px;
    gap:4px;
    z-index:6;
    opacity:0.85;
  }
  .dpad button{
    border:none; border-radius:10px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:#dfe6ff;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .dpad button:active{ background:rgba(255,214,92,0.3); }
  .dpad .up{ grid-column:2; grid-row:1; }
  .dpad .left{ grid-column:1; grid-row:2; }
  .dpad .down{ grid-column:2; grid-row:3; }
  .dpad .right{ grid-column:3; grid-row:2; }

  .overlay {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(4,4,15,0.88);
    backdrop-filter: blur(2px);
    color: #eef0ff;
    padding: 24px;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, #FFD65C, #5CA8FF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 14px;
    color: #b0b6d9;
    letter-spacing: 0.02em;
    margin-bottom: 30px;
    max-width: 280px;
    line-height: 1.5;
  }
  .stat-row { display: flex; gap: 40px; margin-bottom: 30px; }
  .stat .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: #7a80a8; margin-bottom: 4px; }
  .stat .value { font-size: 28px; font-weight: 700; font-family: "SFMono-Regular", Consolas, monospace; }
  .stat.score .value { color: #FFD65C; }
  .stat.best .value { color: #5CA8FF; }

  .tap-btn {
    border: none;
    background: linear-gradient(135deg, #FFD65C, #f0b429);
    color: #221900;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    padding: 15px 38px;
    border-radius: 30px;
    box-shadow: 0 8px 24px rgba(255,214,92,0.3);
  }
  .tap-btn:active { transform: translateY(2px); }
</style>
</head>
<body>

<div id="wrap">
  <div class="hud">
    <div class="score"><div class="label">Score</div><div class="value" id="hudScore">0</div></div>
    <div class="lives-row" id="hudLives"><div class="pac"></div><div class="pac"></div><div class="pac"></div></div>
    <div class="best"><div class="label">Best</div><div class="value" id="hudBest">0</div></div>
  </div>
  <canvas id="game"></canvas>
</div>

<div class="dpad" id="dpad">
  <button class="up" data-dx="0" data-dy="-1">â–²</button>
  <button class="left" data-dx="-1" data-dy="0">â—€</button>
  <button class="down" data-dx="0" data-dy="1">â–¼</button>
  <button class="right" data-dx="1" data-dy="0">â–¶</button>
</div>

<div class="overlay" id="startOverlay">
  <div class="title">MUNCH</div>
  <div class="subtitle">Clear every dot in the maze while four ghosts hunt you down. Grab a glowing pellet to turn the tables â€” for a few seconds, you're the predator.</div>
  <button class="tap-btn" id="startBtn">Start</button>
</div>

<div class="overlay hidden" id="overOverlay">
  <div class="title" id="endTitle" style="font-size:30px;">Caught!</div>
  <div class="stat-row">
    <div class="stat score"><div class="label">Score</div><div class="value" id="finalScore">0</div></div>
    <div class="stat best"><div class="label">Best</div><div class="value" id="finalBest">0</div></div>
  </div>
  <button class="tap-btn" id="retryBtn">Retry</button>
</div>

<script>
(function(){
  var MAZE = ["#################","#...#.......#...#","###.#.#.#.###.#.#","#...#...#.......#","#.###.###.#.#.#.#","#.......#.......#","#.#.###.#.#.#.#.#","#.#.....#.......#","#.#.#.###.#.#.#.#","#.........#.....#","#.#.#.###.#.#.#.#","#.............#.#","#.#.#.#.###.#.#.#","#...#.......#...#","#.#.#.#.#.#.###.#","#.#...#.#.......#","#.#####.#.#.#.#.#","#...............#","#.#.#####.#.###.#","#...#...........#","#################"];
  var COLS = MAZE[0].length, ROWS = MAZE.length;
  var PLAYER_START = {x:8,y:9};
  var GHOST_SPAWNS = [{x:6,y:13},{x:7,y:13},{x:9,y:13},{x:10,y:13}];
  var PELLETS = [{x:1,y:1},{x:15,y:1},{x:1,y:19},{x:15,y:19}];
  var GHOST_COLORS = ['#FF5C6E','#FF9FE0','#5CE0FF','#FFB25C'];

  function isWall(cx, cy){
    if (cy < 0 || cy >= ROWS || cx < 0 || cx >= COLS) return true;
    return MAZE[cy][cx] === '#';
  }
  function isSpecial(cx,cy,list){
    return list.some(function(p){ return p.x===cx && p.y===cy; });
  }

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var tile, offX, offY, W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    tile = Math.floor(Math.min(W/COLS, H/ROWS));
    offX = (W - tile*COLS)/2;
    offY = (H - tile*ROWS)/2;
  }
  window.addEventListener('resize', resize);

  var dots, dotsRemaining, score, best=0, lives, running, frightTimer, frightTotal, ghostEatCombo, animT;
  var player, ghosts;

  function initLevel(){
    dots = [];
    dotsRemaining = 0;
    for (var y=0;y<ROWS;y++){
      dots.push([]);
      for (var x=0;x<COLS;x++){
        var open = !isWall(x,y);
        var isStart = (x===PLAYER_START.x && y===PLAYER_START.y);
        var isSpawn = isSpecial(x,y,GHOST_SPAWNS);
        var isPellet = isSpecial(x,y,PELLETS);
        if (open && !isStart && !isSpawn && !isPellet){ dots[y].push(1); dotsRemaining++; }
        else if (isPellet){ dots[y].push(2); dotsRemaining++; }
        else { dots[y].push(0); }
      }
    }
  }

  function resetPositions(){
    player = { x: PLAYER_START.x, y: PLAYER_START.y, dir:{dx:0,dy:0}, next:{dx:0,dy:0}, mouth:0 };
    ghosts = GHOST_SPAWNS.map(function(s,i){
      return { x:s.x, y:s.y, dir:{dx: (i%2===0?1:-1), dy:0}, color: GHOST_COLORS[i], state:'chase', release: 1.6 + i*0.5, spawnX:s.x, spawnY:s.y };
    });
    frightTimer = 0; frightTotal = 0; ghostEatCombo = 0;
  }

  function reset(){
    score = 0; lives = 3; running = true; animT = 0;
    initLevel();
    resetPositions();
    updateHud();
  }

  function updateHud(){
    document.getElementById('hudScore').textContent = score;
    var el = document.getElementById('hudLives');
    el.innerHTML = '';
    for (var i=0;i<lives;i++){ var d = document.createElement('div'); d.className='pac'; el.appendChild(d); }
  }

  function neighborsOf(cx,cy,excludeReverse){
    var dirs = [{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}];
    return dirs.filter(function(d){
      if (excludeReverse && d.dx===-excludeReverse.dx && d.dy===-excludeReverse.dy) return false;
      return !isWall(cx+d.dx, cy+d.dy);
    });
  }

  function updatePlayer(dt, speed){
    var atCenter = Math.abs(player.x-Math.round(player.x))<0.06 && Math.abs(player.y-Math.round(player.y))<0.06;
    if (atCenter){
      var rx = Math.round(player.x), ry = Math.round(player.y);
      player.x = rx; player.y = ry;
      if ((player.next.dx||player.next.dy) && !isWall(rx+player.next.dx, ry+player.next.dy)){
        player.dir = player.next;
      } else if (isWall(rx+player.dir.dx, ry+player.dir.dy)){
        player.dir = {dx:0,dy:0};
      }
      // eat
      if (dots[ry][rx] === 1){ dots[ry][rx]=0; dotsRemaining--; score += 10; }
      else if (dots[ry][rx] === 2){ dots[ry][rx]=0; dotsRemaining--; score += 50; startFright(); }
    }
    player.x += player.dir.dx*speed*dt;
    player.y += player.dir.dy*speed*dt;
    if (player.dir.dx || player.dir.dy) player.mouth += dt*10;
  }

  function startFright(){
    frightTotal = 6.5; frightTimer = 6.5; ghostEatCombo = 0;
    ghosts.forEach(function(g){
      if (g.state !== 'eaten'){
        g.state = 'frightened';
        g.dir = {dx:-g.dir.dx, dy:-g.dir.dy};
      }
    });
  }

  function updateGhost(g, dt, speedBase){
    if (g.release > 0) g.release -= dt;
    var speed = speedBase;
    if (g.state === 'frightened') speed = speedBase*0.6;
    if (g.state === 'eaten') speed = speedBase*2.0;

    var atCenter = Math.abs(g.x-Math.round(g.x))<0.06 && Math.abs(g.y-Math.round(g.y))<0.06;
    if (atCenter){
      var rx = Math.round(g.x), ry = Math.round(g.y);
      g.x = rx; g.y = ry;

      if (g.state === 'eaten'){
        if (rx === g.spawnX && ry === g.spawnY){ g.state='chase'; }
      }

      var opts = neighborsOf(rx, ry, g.dir);
      if (opts.length === 0) opts = neighborsOf(rx, ry, null);

      var target;
      if (g.release > 0){
        target = null; // still releasing, wander
      } else if (g.state === 'frightened'){
        target = null; // random
      } else if (g.state === 'eaten'){
        target = {x:g.spawnX, y:g.spawnY};
      } else {
        target = {x:player.x, y:player.y};
      }

      var chosen;
      if (!target || Math.random() < 0.12){
        chosen = opts[Math.floor(Math.random()*opts.length)];
      } else {
        var best_d = Infinity;
        opts.forEach(function(o){
          var nx = rx+o.dx, ny = ry+o.dy;
          var d = (nx-target.x)*(nx-target.x) + (ny-target.y)*(ny-target.y);
          if (d < best_d){ best_d = d; chosen = o; }
        });
      }
      g.dir = chosen;
    }
    g.x += g.dir.dx*speed*dt;
    g.y += g.dir.dy*speed*dt;
  }

  function checkCollisions(){
    ghosts.forEach(function(g){
      if (g.state === 'eaten') return;
      var dx = g.x-player.x, dy = g.y-player.y;
      if (dx*dx+dy*dy < 0.35){
        if (g.state === 'frightened'){
          g.state = 'eaten';
          ghostEatCombo++;
          score += 200*Math.pow(2, Math.min(ghostEatCombo-1,3));
        } else {
          loseLife();
        }
      }
    });
  }

  function loseLife(){
    lives--;
    updateHud();
    if (lives <= 0){ crash(false); }
    else { resetPositions(); }
  }

  function crash(won){
    running = false;
    best = Math.max(best, score);
    document.getElementById('endTitle').textContent = won ? 'Maze Cleared!' : 'Caught!';
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('hudBest').textContent = best;
    setTimeout(function(){ document.getElementById('overOverlay').classList.remove('hidden'); }, 300);
  }

  function update(dt){
    if (!running) return;
    animT += dt;
    var pSpeed = 5.0, gSpeed = 4.35;

    if (frightTimer > 0){
      frightTimer -= dt;
      if (frightTimer <= 0){
        ghosts.forEach(function(g){ if (g.state==='frightened') g.state='chase'; });
      }
    }

    updatePlayer(dt, pSpeed);
    ghosts.forEach(function(g,i){
      if (g.spawnX===undefined){ g.spawnX = GHOST_SPAWNS[i].x; g.spawnY = GHOST_SPAWNS[i].y; }
      updateGhost(g, dt, gSpeed);
    });
    checkCollisions();

    if (dotsRemaining <= 0){ crash(true); }
  }

  function drawMaze(){
    for (var y=0;y<ROWS;y++){
      for (var x=0;x<COLS;x++){
        var px = offX+x*tile, py = offY+y*tile;
        if (MAZE[y][x] === '#'){
          ctx.fillStyle = 'rgba(92,168,255,0.10)';
          ctx.fillRect(px+1, py+1, tile-2, tile-2);
          ctx.strokeStyle = 'rgba(92,168,255,0.5)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(px+1.5, py+1.5, tile-3, tile-3);
        } else {
          var d = dots[y][x];
          if (d === 1){
            ctx.beginPath();
            ctx.fillStyle = '#FFE9A8';
            ctx.arc(px+tile/2, py+tile/2, Math.max(1.5,tile*0.07), 0, Math.PI*2);
            ctx.fill();
          } else if (d === 2){
            var pulse = 0.6+0.4*Math.sin(animT*6);
            ctx.beginPath();
            ctx.fillStyle = '#FFD65C';
            ctx.shadowColor = '#FFD65C'; ctx.shadowBlur = 10*pulse;
            ctx.arc(px+tile/2, py+tile/2, tile*0.22*pulse+tile*0.1, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }
      }
    }
  }

  function drawPlayer(){
    var px = offX+player.x*tile+tile/2, py = offY+player.y*tile+tile/2;
    var r = tile*0.42;
    var angle = 0;
    if (player.dir.dx===1) angle=0;
    else if (player.dir.dx===-1) angle=Math.PI;
    else if (player.dir.dy===-1) angle=-Math.PI/2;
    else if (player.dir.dy===1) angle=Math.PI/2;
    var mouthOpen = Math.abs(Math.sin(player.mouth))*0.28+0.06;
    ctx.save();
    ctx.translate(px,py);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r, mouthOpen*Math.PI, (2-mouthOpen)*Math.PI);
    ctx.closePath();
    ctx.fillStyle = '#FFD65C';
    ctx.shadowColor = '#FFD65C'; ctx.shadowBlur = 12;
    ctx.fill();
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawGhost(g){
    var px = offX+g.x*tile+tile/2, py = offY+g.y*tile+tile/2;
    var r = tile*0.42;
    var color = g.color;
    var flashing = g.state==='frightened' && frightTimer < 1.8 && Math.floor(animT*8)%2===0;
    if (g.state === 'frightened') color = flashing ? '#EAF2FF' : '#3A5CFF';
    if (g.state === 'eaten'){
      // eyes only
      drawEyes(px,py,r,g.dir);
      return;
    }
    ctx.beginPath();
    ctx.moveTo(px-r, py+r*0.6);
    ctx.arc(px, py, r, Math.PI, 0);
    ctx.lineTo(px+r, py+r*0.6);
    var bumps = 4;
    for (var i=bumps;i>=0;i--){
      var bx = px + r - (2*r*i/bumps);
      var by = py + r*0.6 + ((i%2===0)? r*0.35 : 0);
      ctx.lineTo(bx, by);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    drawEyes(px,py,r,g.dir);
  }

  function drawEyes(px,py,r,dir){
    var ex = dir.dx*r*0.22, ey = dir.dy*r*0.22;
    [-1,1].forEach(function(s){
      ctx.beginPath();
      ctx.fillStyle = '#fff';
      ctx.arc(px+s*r*0.35, py-r*0.1, r*0.22, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = '#1a1a2e';
      ctx.arc(px+s*r*0.35+ex*0.6, py-r*0.1+ey*0.6, r*0.11, 0, Math.PI*2);
      ctx.fill();
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#04040F';
    ctx.fillRect(0,0,W,H);
    drawMaze();
    if (running){
      ghosts.forEach(drawGhost);
      drawPlayer();
    }
  }

  var lastTime = null;
  function loop(t){
    if (lastTime===null) lastTime = t;
    var dt = Math.min((t-lastTime)/1000, 0.05);
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function setDir(dx,dy){ player.next = {dx:dx, dy:dy}; }

  document.addEventListener('keydown', function(e){
    if (e.key==='ArrowUp' || e.key==='w' || e.key==='W') setDir(0,-1);
    else if (e.key==='ArrowDown' || e.key==='s' || e.key==='S') setDir(0,1);
    else if (e.key==='ArrowLeft' || e.key==='a' || e.key==='A') setDir(-1,0);
    else if (e.key==='ArrowRight' || e.key==='d' || e.key==='D') setDir(1,0);
  });

  document.querySelectorAll('.dpad button').forEach(function(b){
    var fn = function(e){ e.preventDefault(); setDir(+b.dataset.dx, +b.dataset.dy); };
    b.addEventListener('touchstart', fn, {passive:false});
    b.addEventListener('mousedown', fn);
  });

  var touchStartX=0, touchStartY=0, touching=false;
  canvas.addEventListener('touchstart', function(e){ touching=true; touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; }, {passive:true});
  canvas.addEventListener('touchmove', function(e){
    if (!touching) return;
    var dx = e.touches[0].clientX-touchStartX, dy = e.touches[0].clientY-touchStartY;
    if (Math.abs(dx)>24 || Math.abs(dy)>24){
      if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1, 0);
      else setDir(0, dy>0?1:-1);
      touching=false;
    }
  }, {passive:true});

  document.getElementById('startBtn').addEventListener('click', function(){
    document.getElementById('startOverlay').classList.add('hidden');
    resize();
    reset();
  });
  document.getElementById('retryBtn').addEventListener('click', function(){
    document.getElementById('overOverlay').classList.add('hidden');
    resize();
    reset();
  });

  resize();
  running = false;
  player = { x: PLAYER_START.x, y: PLAYER_START.y, dir:{dx:0,dy:0}, next:{dx:0,dy:0}, mouth:0 };
  ghosts = GHOST_SPAWNS.map(function(s,i){ return { x:s.x, y:s.y, dir:{dx:0,dy:0}, color: GHOST_COLORS[i], state:'chase', release:0, spawnX:s.x, spawnY:s.y }; });
  initLevel();
  requestAnimationFrame(loop);
  window.addEventListener('load', resize);
})();
</script>

</body>
</html>
